<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分析目标样例 · Codex 用量与更新助手</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf0f3;color:#30343b;font:14px 'Microsoft YaHei UI','Microsoft YaHei',sans-serif}header{max-width:1000px;margin:25px auto;padding:0 20px}h1{font-size:23px}p{line-height:1.8}a{color:inherit}.panel{--bg:#141d22;--card:#192328;--ink:#e9e0ca;--line:#65573c;--gold:#cba15d;width:640px;max-width:calc(100% - 24px);margin:20px auto;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 40px #0001}.panel.light{--bg:#fafbfd;--card:#fff;--ink:#414954;--line:#dce1e7;--gold:#6579ab}button,select{font:inherit;padding:7px 12px;border-radius:7px;border:1px solid var(--line,#ccc);color:inherit;background:transparent;cursor:pointer}button:hover,button.on{background:var(--line)}button:focus-visible,select:focus-visible{outline:2px solid #cc9c5a}.top,.tabs,.times{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.top{justify-content:space-between}.tabs{margin:18px 0 10px}.times{margin-bottom:16px}.card{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:18px;margin:12px 0}.summary{display:flex;align-items:center;gap:24px}.ring{width:154px;height:154px;border:13px solid var(--line);border-top-color:var(--gold);border-right-color:var(--gold);border-bottom-color:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;flex-shrink:0}.big{font-size:25px}.muted{opacity:.65;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metrics strong{display:block;font-size:23px;margin:9px 0;font-weight:500}h2{font-size:17px;margin:0 0 12px}hr{border:0;border-top:1px solid var(--line);margin:15px 0}.row{display:flex;justify-content:space-between;padding:8px 0;gap:12px}.bars{height:145px;display:flex;align-items:flex-end;gap:4px;border-bottom:1px solid var(--line)}.bars i{flex:1;background:var(--gold);border-radius:4px 4px 0 0}.axis{display:flex;justify-content:space-between;margin-top:8px;font-size:11px}.track{height:7px;background:var(--line);border-radius:10px;margin:10px 0}.track i{display:block;height:7px;background:var(--gold);border-radius:10px}select option{color:#30343b;background:#fff}.note{font-size:12px;line-height:1.7;opacity:.8}@media(max-width:480px){.summary{flex-direction:column}.metrics{grid-template-columns:1fr}.big{font-size:21px}}</style>
<header><a href="interface-gallery.html">← 返回完整界面样例册</a><h1>分析页 / 数据接入后的目标效果</h1><p>参考所提供截图的信息层级，收进与设置同宽的 640px 面板。下方为虚构数据演示，尚未接入真实账户；“无数据”可检查字段不可用时的显示。黑金为参考效果，原生主题单独适配。</p></header>
<div class="panel" id="panel"><div class="top"><span>Codex · 使用分析</span><select id="theme" aria-label="主题"><option value="">参考黑金</option><option value="light">原生浅色</option></select></div><div class="tabs" id="tabs"></div><div class="times" id="times"></div><div id="content"></div><p class="note">演示数据 · 数据来源与覆盖范围须在正式接入后标注。缓存不重复计入总量；不展示未经核验的金额估算。</p></div>
<script>
let tab='概览',period='今日',empty=false;const titles=['概览','趋势','模型','数据来源'];function val(v){return empty?'暂无数据':v}function draw(){document.querySelector('#tabs').innerHTML=titles.map(t=>`<button data-tab="${t}" class="${tab===t?'on':''}">${t}</button>`).join('');document.querySelector('#times').innerHTML=['今日','7 天','30 天'].map(t=>`<button data-period="${t}" class="${period===t?'on':''}">${t}</button>`).join('')+`<button id="empty">${empty?'显示样例':'无数据'}</button>`;let f=period==='今日'?1:period==='7 天'?5:18;let c='';if(tab==='概览')c=`<div class="card summary"><div class="ring"><span class="big">${val((1.28*f).toFixed(2)+'亿')}</span><span class="muted">${period} Token</span></div><div><h2>消耗概览</h2><p>所选期间的 Token 总量</p><p class="muted">圆环表示输入/输出构成，非套餐剩余</p><span>活跃小时：${val(6*f+' 小时')}</span></div></div><div class="card"><h2>Agent 工作强度</h2><div class="metrics"><div>模型请求<strong>${val(420*f)}</strong></div><div>工具调用<strong>${val(860*f)}</strong></div><div>缓存命中率<strong>${val('75%')}</strong></div></div><hr><div class="row"><span>输入</span><span>${val((1.2*f).toFixed(2)+'亿')}</span></div><div class="row"><span>缓存输入（包含于输入）</span><span>${val((.9*f).toFixed(2)+'亿')}</span></div><div class="row"><span>输出</span><span>${val(800*f+'万')}</span></div></div>`;
if(tab==='趋势'){let n=period==='今日'?24:period==='7 天'?7:30;c=`<div class="card"><h2>${period==='今日'?'今日分时':'每日趋势'}</h2>${empty?'<p>暂无数据</p>':`<div class="bars">${Array.from({length:n},(_,i)=>`<i style="height:${10+(i*29%88)}%" title="虚构数据柱 ${i+1}"></i>`).join('')}</div>`}<div class="axis"><span>${period==='今日'?'0时':'周期开始'}</span><span>${period==='今日'?'12时':''}</span><span>${period==='今日'?'23时':'周期结束'}</span></div></div><div class="card"><h2>来源占比</h2><div class="row"><span>Codex</span><span>${val('100%')}</span></div><div class="track"><i style="width:${empty?0:100}%"></i></div><p class="muted">仅在已识别来源范围内计算，不虚构其他产品。</p></div>`}
if(tab==='模型')c=`<div class="card"><h2>${period}模型消耗</h2>${['模型 A','模型 B'].map((m,i)=>`<div class="row"><span>${m}</span><span>${val(i?'2560万 · 20%':'1.024亿 · 80%')}</span></div><div class="track"><i style="width:${empty?0:i?20:80}%"></i></div>`).join('')}<p class="muted">虚构样例，用于展示模型 Token 和占比的完整布局。</p></div><div class="card"><h2>金额估算</h2><p>暂无可靠计费依据</p><p class="muted">套餐消耗不等同 API 实付金额。</p></div>`;
if(tab==='数据来源')c='<div class="card"><h2>已确认的接入线索</h2><p>account/usage/read 协议定义每日 Token 桶及累计 Token。需验证实际账号返回、日期范围和时区。</p><h2>需要继续核验</h2><p>原生分析的产品/模型/工具统计；输入、缓存、输出及小时明细。缺失时显示暂无数据。</p><h2>连接方式</h2><p>本机数据源 → C# 规范化 → 本地 HTML 消息桥 → 图表。</p><p>桥接为建议实现，当前 HTML 未连接后台。本地日志统计与官方聚合需分别标注。</p></div>';document.querySelector('#content').innerHTML=c}
document.addEventListener('click',e=>{if(e.target.dataset.tab)tab=e.target.dataset.tab;else if(e.target.dataset.period)period=e.target.dataset.period;else if(e.target.id==='empty')empty=!empty;else return;draw()});document.querySelector('#theme').onchange=e=>document.querySelector('#panel').className='panel '+e.target.value;draw();
</script></html>
